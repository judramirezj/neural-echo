# Render blueprint for Neural Echo — frontend only.
#
# The backend (neural-echo-api) moved off Render to a RunPod GPU pod
# (RTX 4090, $0.74/hr) after finding Render's CPU-only plans both too slow
# (TRIBE scoring, see FINDINGS.md) and unstable under real load (jobs
# disappearing mid-run — likely OOM/crash-restarts we couldn't fully
# diagnose without Render's dashboard logs). See README for the full story.
#
# IMPORTANT: the RunPod URL below is tied to that specific pod's ID
# (https://<pod-id>-8000.proxy.runpod.net) — if the pod is ever recreated,
# this value must be updated here and neural-echo-web redeployed (it's a
# Next.js build-time env var, baked into the JS bundle — a plain restart
# does NOT pick up a changed value, only a rebuild does).
services:
  - type: web
    name: neural-echo-web
    runtime: node
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    plan: starter
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://xil70osrnqvshp-8000.proxy.runpod.net
